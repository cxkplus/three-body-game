<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="基于《三体》的文明生存游戏：在三颗太阳的真实混沌引力中预测天象、脱水求生，赶在毁灭之前飞向太空。">
<meta property="og:title" content="三体：文明纪元">
<meta property="og:description" content="带领三体文明在乱纪元中求生——真实三体物理模拟，原著名士登场，文明轮回不止。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2306080d'/%3E%3Ccircle cx='10' cy='10' r='6' fill='%23ffc868'/%3E%3Ccircle cx='23' cy='13' r='4' fill='%23ff9038'/%3E%3Ccircle cx='17' cy='24' r='3' fill='%23e08a3e'/%3E%3C/svg%3E">
<title>三体：文明纪元</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="civ-info">第 ? 号文明 · 石器时代</div>
    <div id="year-info">三体历 0 年</div>
    <div id="topbar-right">
      <button id="chronicle-btn" title="历代文明的命运记录">📜 史册</button>
      <div id="climate-banner" class="climate-mild">——</div>
    </div>
  </header>

  <main id="layout">
    <section id="left-col">
      <canvas id="sky" width="640" height="420"></canvas>
      <div id="forecast">
        <span class="forecast-label">天象预报</span>
        <div id="forecast-strip"></div>
      </div>
    </section>

    <section id="right-col">
      <div id="stats">
        <div class="stat"><span class="stat-name">人口</span><span id="stat-pop">10 万</span></div>
        <div class="stat"><span class="stat-name">粮食</span><span id="stat-food">50</span></div>
        <div class="stat"><span class="stat-name">科技</span><span id="stat-sci">0</span></div>
        <div class="stat"><span class="stat-name">观测台</span><span id="stat-obs">Lv 0</span></div>
        <div class="stat"><span class="stat-name">状态</span><span id="stat-hydra">含水</span></div>
        <div class="stat"><span class="stat-name">星舰计划</span><span id="stat-ship">未解锁</span></div>
        <div class="stat"><span class="stat-name">执政顾问</span><span id="stat-advisor" class="advisor">——</span></div>
      </div>

      <div id="actions">
        <button id="act-farm" class="act" title="粮食 += 人口×1.0×时代倍率×气候系数">🌾 耕作</button>
        <button id="act-research" class="act" title="科技 += 人口×0.6×时代倍率">🔬 研究</button>
        <button id="act-breed" class="act" title="人口增长12%×气候系数，额外消耗粮食">👥 繁衍</button>
        <button id="act-observe" class="act" title="提升观测台等级，预报看得更远">🔭 建观测台</button>
        <button id="act-dehydrate" class="act" title="全民脱水：免疫多数灾害，但无产出">💧 全民脱水</button>
        <button id="act-wait" class="act" title="什么都不做，让时间流逝。脱水状态下熬过灾难的唯一手段">⏳ 静待</button>
        <button id="act-ship" class="act" title="太空时代解锁：投入3次即胜利">🚀 星舰计划</button>
      </div>

      <div id="log"></div>
    </section>
  </main>

  <div id="modal" class="hidden">
    <div id="modal-box">
      <h2 id="modal-title">文明毁灭</h2>
      <p id="modal-text"></p>
      <div class="modal-actions">
        <button id="modal-card-btn" class="ghost-btn">🖼 保存战绩卡片</button>
        <button id="modal-btn">文明将重新启动</button>
      </div>
    </div>
  </div>

  <footer id="credit">
    灵感与世界观源自 <strong>刘慈欣《三体》</strong>（重庆出版社）· 本游戏为粉丝同人作品，非商业、与原作者及出版方无关 ·
    <a href="https://github.com/cxkplus/three-body-game" target="_blank" rel="noopener">源码</a>
  </footer>

  <div id="chronicle" class="hidden">
    <div id="chronicle-box">
      <h2>文 明 史 册</h2>
      <div id="chronicle-stats"></div>
      <div id="chronicle-list"></div>
      <button id="chronicle-close">合上史册</button>
    </div>
  </div>
</div>

<script src="js/physics.js"></script>
<script src="js/game.js"></script>
<script src="js/chronicle.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
